# H2 in-memory DB for local dev and tests
spring.datasource.url=jdbc:h2:mem:petdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#---------- Swagger configurations --------------
springdoc.swagger-ui.enabled=true
api-docs.enabled=true

# ---------- JWT ----------
# Verification-only: Core never issues tokens, only checks ones authService signed.
# Must be byte-for-byte identical to authService's application-local.properties value.
jwt.secret=thisIsSecretKeyForLocalEnvironment
