spring.application.name=petManagementService
server.port=8080


spring.config.import=optional:file:./.env[.properties]


spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.qjivggbmmfdxqyhcwzvu}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=600000

# ---------- JPA / Hibernate ----------
# 'update' lets Hibernate create/alter tables from our @Entity classes while we
# are learning. Before going live we switch this to 'validate' and manage the
# schema with Flyway migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- India-specific defaults ----------
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info

#---------- Swagger configurations --------------
springdoc.swagger-ui.enabled=true
api-docs.enabled=true
